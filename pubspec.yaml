name: ebroker #! DO NOT CHANGE THIS
description: Welcome to eBroker.

publish_to: 'none'
version: 1.8.0+88

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI & Charts
  carousel_slider: ^5.0.0
  custom_refresh_indicator: ^4.0.1
  fl_chart: ^1.2.0
  dotted_border: ^3.0.1
  flutter_widget_from_html: ^0.17.1
  flutter_svg: ^2.0.10+1
  flutter_typeahead: ^6.0.0
  nested: ^1.0.0

  # Firebase Services
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # Authentication & Sign-in
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

  # Media & Visuals
  cached_network_image: ^3.4.1
  omni_video_player: ^4.0.2
  video_player: ^2.12.0
  video_trimmer: ^5.0.0
  flutter_image_compress: ^2.4.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.2
  panorama_viewer: ^2.0.4

  # Audio
  just_audio: ^0.10.0
  record: ^7.1.1

  # Animations
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # Networking & HTTP
  connectivity_plus: ^7.0.0
  dio: ^5.7.0
  http: ^1.0.0
  http_parser: ^4.1.2

  # State Management & Storage
  flutter_bloc: ^9.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # Location & Maps
  geocoding: ^5.0.0
  geolocator: ^14.0.0
  google_maps_flutter: ^2.17.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  google_maps_cluster_manager_2: ^3.2.0
  flutter_map_marker_cluster: ^8.2.2
  webview_flutter: ^4.13.1

  # Pickers & Input
  country_picker: ^2.0.28
  file_picker: ^12.0.0-beta.7
  sms_autofill: ^2.5.0

  # Utilities & Tools
  fluttertoast: ^9.1.0
  intl: ^0.20.0
  open_filex: ^4.7.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  printing: ^5.14.3
  share_plus: ^13.2.0
  timeago: ^3.7.0
  url_launcher: ^6.3.2
  
  
  # Payment Gateways
  in_app_purchase: ^3.2.3

  # Notifications & Reviews
  awesome_notifications: ^0.12.1
  google_mobile_ads: ^9.0.0
  in_app_review: ^2.0.12

  # PDF Generation
  flutter_native_html_to_pdf: ^3.1.0

  # Moved from dependencies_overrides
  web: ^1.0.0
  collection: ^1.19.1
  table_calendar: ^3.2.0
  timezone: ^0.11.0
  dot_shorthand_converter: ^0.0.4
  animations: ^2.2.0
  mime: ^2.0.0
  webview_flutter_android: ^4.12.2
  webview_flutter_wkwebview: ^3.25.1
  
  
  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icons/ic_launcher.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/svg/
    - assets/svg/agent/
    - assets/app_icons/
    - assets/languages/
    - assets/lottie/
    - assets/social_media/
    - assets/chat_background/
    - assets/svg/MultiColorSvg/
    - assets/svg/Fallback/
    - assets/map_styles/

  fonts:
    - family: PrimaryFont 
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800